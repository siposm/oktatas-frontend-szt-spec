<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Fetch</h1>
    <script>
      async function getUser() {
        try {
          const response = await fetch("https://jsonplaceholder.typicode.com/users/1")

          if (!response.ok) {
            throw new Error(`HTTP hiba: ${response.status}`)
          }

          const user = await response.json()

          console.log("Név:", user.name)
          console.log("Email:", user.email)
          console.log("Város:", user.address.city)
        } catch (error) {
          console.error("Hiba:", error.message)
        }
      }

      getUser()

		</script>

		<script type="module">
			// ha direktben akarunk await-et használni async func nélkül, akkor a script-et modulnak kell megjelölni
			let resp = await fetch("https://api.siposm.hu/word?count=10")
			let data = await resp.json()
			console.log(data)
		</script>
  </body>
</html>
