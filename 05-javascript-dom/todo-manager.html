<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TODO Manager</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<style>
		.todo-item::before {
			content: "✅";
			padding-right: 3px;
		}
	</style>
</head>
<body>
	<h1 class="text-center mt-2">TODO Manager</h1>
	<hr>
	<div class="row m-3">
		<div class="col alert alert-info m-2">
			<h4>CREATE NEW TODO</h4>
		</div>
		<div class="col alert alert-warning m-2">
			<h4>EDIT EXISTING TODO</h4>
		</div>
	</div>
	<hr>
	<div class="container">
		<h4>List of TODOs</h4>
		<div id="todo-list"></div>
	</div>

	<script src="todo-manager.js"></script>
</body>
</html>
