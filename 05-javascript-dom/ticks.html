<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	<div class="counter"></div>
	<div class="target"></div>

	<script>
		setTimeout(() => {
			let t = document.querySelector(".target")
			t.textContent = "Lejárt a 4 másodperc!"
		}, 4000)

		setInterval(() => {
			let t = document.querySelector(".counter")
			t.textContent += "█"
		}, 1000)
	</script>
</body>
</html>
