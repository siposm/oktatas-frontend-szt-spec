<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Render in callback</h1>
		<div id="users"></div>
    <script>
      let users = []

      fetch("https://jsonplaceholder.typicode.com/users")
        .then((response) => response.json())
        .then((data) => (users = data))

      console.log(users) // [] üres tömb, mert ez a rész hamarabb lefut mint ahogy a fentebbi fetch eredménye megérkezik

      fetch("https://jsonplaceholder.typicode.com/users")
        .then((response) => response.json())
        .then((data) => {
          users = data
          renderUsers() // ez már csak akkor fog lefutni, amikor a válasz visszajön -> nem lesz üres tömb
        })

      function renderUsers() {
        document.querySelector("#users").innerHTML = users
          .map((user) => `<p>${user.name}</p>`)
          .join("")
      }
    </script>
  </body>
</html>
